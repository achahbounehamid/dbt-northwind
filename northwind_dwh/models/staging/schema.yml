version: 2.2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
          
  - name: stg_categories
    columns:
      - name: category_id
        tests:
          - unique
          - not_null    

  - name: stg_employees
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null      

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_shippers
    columns:
      - name: shipper_id
        tests:
          - unique
          - not_null    

  - name: stg_suppliers
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null   

  - name: stg_order_details
    columns:
        tests:
          -dbt_utils.unique_combination_of_columns:
            combination_of_columns:
              - order_id
              - product_id
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null



